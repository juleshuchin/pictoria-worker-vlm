slug: pictoria-vlm
display_name: VLM générique (vLLM)
type: visual-llm
gpu_usage: required
model_usage: disabled

description: |
  Worker pictorIA qui interroge un modèle vision-langage (VLM) servi par vLLM
  sur l'image de chaque élément, puis enregistre la réponse comme transcription.

  Le modèle se choisit par son identifiant Hugging Face : Qwen3.5, Qwen3.8
  (y compris les versions FP8 ou AWQ), GLM-OCR, olmOCR, PaddleOCR-VL ou tout
  autre modèle que vLLM sait charger.

  Les réglages de mémoire de vLLM (part du GPU, désactivation des graphes CUDA,
  longueur du contexte, taille des images) sont exposés dans la configuration.

docker:
  command: worker-pictoria-vlm
  shm_size: 8g

configuration:
  - key: model
    display_name: Identifiant du modèle sur Hugging Face
    type: string
    required: true
    default: Qwen/Qwen3.5-9B

  - key: hf_token
    display_name: Jeton Hugging Face (secret Arkindex, facultatif)
    type: secret
    required: false

  - key: system_prompt
    display_name: Consigne système (facultative)
    type: text
    required: false
    default: ""

  - key: user_prompt
    display_name: Consigne envoyée avec l'image
    type: text
    required: true
    default: |
      Transcris tout le texte de cette page dans l'ordre de lecture. N'écris rien d'autre que la transcription.

  - key: max_new_tokens
    display_name: Longueur maximale de la réponse (tokens)
    type: int
    default: 4096

  - key: temperature
    display_name: Température
    type: float
    default: 0.1

  - key: max_image_side
    display_name: Plus grand côté de l'image envoyée au modèle (pixels)
    type: int
    default: 2000

  - key: max_model_len
    display_name: Longueur maximale du contexte (tokens, image comprise)
    type: int
    default: 16384

  - key: gpu_memory_utilization
    display_name: Part de la mémoire GPU réservée par vLLM (entre 0 et 1)
    type: float
    default: 0.92

  - key: enforce_eager
    display_name: Désactiver les graphes CUDA (moins de mémoire, un peu plus lent)
    type: bool
    default: true

  - key: quantization
    display_name: Quantification à la volée
    type: enum
    default: auto
    choices:
      - auto
      - bitsandbytes
      - fp8

  - key: thinking
    display_name: Activer le mode raisonnement (modèles Qwen)
    type: bool
    default: false

  - key: trust_remote_code
    display_name: Autoriser le code fourni avec le modèle
    type: bool
    default: false
